name: Validate plugin
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: git diff --exit-code -- wikipedia.crosspoint-plugin
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run test:epub
      - run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: wikipedia-plugin
          path: dist/*.zip
