name: Release plugin
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: wikipedia-plugin
          path: dist
      - name: Publish stable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
